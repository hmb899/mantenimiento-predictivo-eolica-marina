# preprocesado del dataset CARE (Guck 2024). Parametros de Barnabei 2024 (normalizacion de
# temperatura, Savitzky-Golay), Jankauskas 2024 (ventana) y Alagha 2025 (filtrado de ruido)

data:
  raw_path: "data/raw/CARE_To_Compare"
  processed_path: "data/processed"
  farms: ["B", "C"]
  separator: ";"
  encoding: "latin-1"

# el Status 2 (idling) no aparece ni en B ni en C, verificado en el EDA, asi que el filtro de
# operacion normal se queda en el 0 solo
status_filtering:
  normal_statuses: [0]
  fault_statuses: [4]  # parada, ancla de la exclusion de transiciones
  excluded_statuses: [1, 3, 5]  # derated, servicio, otros

# B y C usan el 0 para marcar el dato ausente. Cada sensor lleva su estrategia de cero en
# zero_handler.py y el contexto operativo es viento medio por encima de wind_cut_in_ms
zero_handling:
  wind_cut_in_ms: 3.0  # sin viento, un 0 de rpm o de potencia es valido
  cross_turbine_temp_threshold: 5.0  # °C de desvio contra la mediana del parque
  counter_freeze_min_samples: 6  # 6 muestras = 1 hora a 10 min

  interpolation:
    max_gap_linear: 3  # hasta 3 muestras (30 min), lineal
    max_gap_ffill: 12  # de 3 a 12 muestras (hasta 2 h), ffill; por encima se queda NaN

# caza las filas de Status 0 con viento de sobra y potencia casi nula
power_curve_filter:
  wind_threshold_ms: 5.0  # m/s
  min_power_kw: 50.0  # kW, solo se usa con use_relative_threshold en false
  # CARE anonimiza y escala los valores, asi que si la potencia no viene en kW el umbral
  # absoluto no sirve y hay que ir por el relativo, que se adapta a la escala de los datos
  use_relative_threshold: true
  min_power_pct: 2.0  # % del percentil 99 de potencia

# quita del train la degradacion previa al fallo y la inestabilidad tras la reparacion.
# Barnabei 2024 daba 24 h y CARE 14 dias en A; aqui 7, los eventos de B y C duran semanas
transition_exclusion:
  hours_before_fault: 168
  hours_after_fault: 72

# dos etapas, limites fisicos duros y despues IQR. Multiplicadores anchos para no recortar
# las distribuciones multimodales del SCADA, turbina parada frente a turbina operando
outlier_detection:
  method: "iqr"
  treatment: "nan"  # a NaN y luego interpolar, conserva la estructura temporal

  iqr_multipliers:
    temperature: 3.0
    power: 3.5  # bimodal, generando o parada
    wind_speed: 3.0
    rpm: 3.0
    voltage: 3.0
    current: 3.0
    pressure: 3.0
    default: 3.0

  physical_limits:
    temperature: [-50.0, 250.0]  # °C
    power: [-500.0, 25000.0]  # kW, se admite negativa
    wind_speed: [0.0, 50.0]  # m/s
    rpm: [0.0, 5000.0]  # rpm, cubre rotor y generador
    voltage: [0.0, 50000.0]  # V
    frequency: [0.0, 100.0]  # Hz
    pressure: [0.0, 500.0]  # bar
    current: [-5000.0, 5000.0]  # A

# opera sobre el estadistico _avg y casa las palabras clave contra la descripcion del sensor,
# sin distinguir mayusculas
feature_selection:
  statistics: ["avg"]

  # de viento y potencia se guarda ademas max/min/std, turbulencia y rampas (Barnabei 2024)
  extra_statistics: ["max", "min", "std"]
  extra_statistics_keywords:
    - "wind speed"
    - "active power"

  # lo que case aqui sobrevive siempre al podado por correlacion (categorias de Barnabei 2024)
  priority_keywords:
    # ambiente
    - "wind speed"
    - "wind direction"
    - "outside temperature"
    - "ambient temperature"
    - "nacelle outside temperature"
    # rotor
    - "rotor speed"
    - "rotor.*speed"
    - "pitch"
    # gondola
    - "nacelle.*temperature"
    - "hub temperature"
    - "yaw"
    # generador
    - "active power"
    - "reactive power"
    - "generator.*speed"
    - "gearbox rotational speed"
    - "generator bearing"
    - "stator winding"
    - "generator cooling air"
    # multiplicadora
    - "gearbox oil"
    - "gearbox bearing"
    - "planetary bearing"
    - "high speed shaft"
    # transformador
    - "transform"  # casa transformer y transformator
    # hidraulico
    - "hydraulic.*oil"
    - "hydraulic.*pressure"
    # rodamiento del rotor
    - "rotor bearing"

  correlation_threshold: 0.80  # se descarta uno de cada par que lo supere en |r|
  min_valid_ratio: 0.70  # fuera las features con mas de un 30% de NaN
  # tope tras el filtrado, primero las prioritarias y el resto por menos NaN
  max_features: 35

  # se fuerza aunque el podado la tire, porque la usa el filtro de curva de potencia y compite
  # con sensor_6_avg, que es una velocidad de viento calculada
  forced_features:
    - "wind_speed_59_avg"

# T normalizada = T componente - T ambiente (Barnabei 2024), quita la estacionalidad. Los
# sensores de ambiente se conservan sin normalizar
temperature_normalization:
  enabled: true
  ambient_keywords:
    - "outside temperature"
    - "ambient temperature"
    - "nacelle outside temperature"
  # descalificados como referencia, el calor de la electronica contamina la lectura
  ambient_exclude_keywords:
    - "cabinet"
    - "internal"
    - "converter"

# Savitzky-Golay (Barnabei 2024), quita ruido sin retardo. Va por segmento continuo y se
# salta los sensores de angulo
smoothing:
  enabled: false  # C, que va pca-first, no suaviza nunca
  window_length: 5  # 5 muestras = 50 min
  poly_order: 2

# Jankauskas 2024 da 3 h (18 muestras) como ventana optima
windowing:
  window_size_samples: 27  # 4.5 h
  stride_samples: 1  # solape maximo
  min_valid_ratio: 0.90  # minimo de valores no NaN por ventana
  max_gap_minutes: 15  # hueco maximo admitido dentro de un segmento continuo

# los NaN que sobreviven en la ventana se rellenan con la media por feature del train
scaling:
  method: "none"  # aqui no se escala, el MinMaxScaler y la PCA van en el pipeline del modelo

export:
  save_numpy: true
  compress_numpy: true
  save_scaler: true

reproducibility:
  random_seed: 42

# se funde en profundidad sobre la base en run_model.run_farm. B mantiene el selector
# curado; C coge todos los _avg sin podar y run_model se queda con el top-100 de XAI
per_farm:
  B:
    # window-first corre el pipeline entero desde run_model, con outlier y temp-norm siempre
    # puestos y el suavizado atado al global; regenera data/processed en cada ejecucion
    data: { dedup_train: true }
    preproc: { outlier: true, temp_norm: true, smooth: false }  # solo si B va pca-first
  C:
    preproc: { outlier: false, temp_norm: false, smooth: false }
    feature_selection:
      statistics: ["avg"]
      extra_statistics: []
      correlation_threshold: 1.01
      max_features: 100000
